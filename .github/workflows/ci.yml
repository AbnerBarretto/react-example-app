name: Continuous Integration & DevSecOps (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Testes e Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js com Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Instalar Dependencias
        run: npm ci

      - name: Linter
        run: npm run lint --if-present

      - name: Testes Unitarios
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build da Aplicacao
        run: CI=false npm run build

  security-scan:
    name: DevSecOps (SAST Semgrep & Container Trivy)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      # 1. SAST - Semgrep
      - name: SAST com Semgrep (OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          auditOn: push

      # 2. Build efemero para analise
      - name: Build Imagem Docker Local
        run: docker build -t app-audit:local .

      # 3. Trivy Container Scanning
      - name: Escanear Imagem Docker com Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'app-audit:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast-scan:
    name: DAST Dinamico com OWASP ZAP (Bonus)
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v4

      - name: Subir Container em Background
        run: |
          docker build -t app-dast:local .
          docker run -d --name app-running -p 80:80 app-dast:local
          sleep 5
          curl -I http://localhost:80

      - name: Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:80'
          issue_title: 'Alerta de Seguranca DAST (OWASP ZAP)'
          fail_action: false