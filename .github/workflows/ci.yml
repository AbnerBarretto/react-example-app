name: Continuous Integration & DevSecOps (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ðŸ” Qualidade, Linters & Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ðŸ“¥ Checkout Seguro do CÃ³digo
        uses: actions/checkout@v4

      - name: âš™ï¸ Configurar Runtime Node.js com Cache Nativo
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: ðŸ“¦ InstalaÃ§Ã£o DeterminÃ­stica de DependÃªncias
        run: npm ci

      - name: ðŸ§¹ VerificaÃ§Ã£o de Qualidade e Sintaxe (Lint)
        run: npm run lint --if-present

      - name: ðŸ§ª ExecuÃ§Ã£o de Testes Automatizados (Fail Fast)
        run: npm test -- --watchAll=false --passWithNoTests

      - name: ðŸ—ï¸ Compilar / Build da AplicaÃ§Ã£o
        run: CI=false npm run build

  security-scan:
    name: ðŸ›¡ï¸ DevSecOps (SAST Semgrep & Container Trivy)
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: ðŸ“¥ Checkout do CÃ³digo
        uses: actions/checkout@v4

      # 1. SAST - Semgrep
      - name: ðŸ” SAST com Semgrep (Regras OWASP Top 10)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          auditOn: push

      # 2. Build efÃªmero para anÃ¡lise
      - name: ðŸ³ Compilar Imagem Docker EfÃªmera para AnÃ¡lise
        run: docker build -t app-audit:local .

      # 3. Trivy Container Scanning
      - name: ðŸ›¡ï¸ Escanear Imagem Docker com Aqua Security Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'app-audit:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  dast-scan:
    name: ðŸŽ¯ DAST DinÃ¢mico com OWASP ZAP Baseline (BÃ´nus)
    needs: [security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - name: ðŸ“¥ Checkout do CÃ³digo
        uses: actions/checkout@v4

      - name: ðŸ³ Compilar e Inicializar Container em Background
        run: |
          docker build -t app-dast:local .
          docker run -d --name app-running -p 80:80 app-dast:local
          sleep 5
          curl -I http://localhost:80

      - name: ðŸš€ Executar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:80'
          issue_title: 'ðŸš¨ Alerta de SeguranÃ§a DAST (OWASP ZAP)'
          fail_action: false